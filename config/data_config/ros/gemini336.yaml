dataset_name: 'gemini336'

ros_topics:
  rgb: "/camera/color/image_raw"
  depth: "/camera/depth/image_raw"
  odom: "/odom"
  camera_info: "/camera/depth/camera_info"

# Depth factor for converting depth values from millimeters to meters
depth_factor: 1000.0

intrinsic:
  fx: 630.8366088867188
  fy: 630.8366088867188
  cx: 635.5
  cy: 366.5


# 下面对应的角度是20.989352916
# 对重力进行分解之后:
# gz = 9.8 * cos(20.989352916)= 9.14974064607056
# gx = 9.8 * sin(20.989352916)= 3.510305700312199
extrinsics:
  - [0.0000000,   -0.358194478,       0.933646998,  0.2600000]
  - [-1,  0,  0.0000000,  0.0000000]
  - [0,  -0.933646998,  -0.358194478,  1.6000000]
  - [0.0000000,   0.0000000,     0.0000000,  1.0000000]

rgb_need_flip: true
depth_need_flip: false

# 具体的计算角度的过程
